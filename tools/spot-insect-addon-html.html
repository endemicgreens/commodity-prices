<div class="egsp" id="egsp" aria-labelledby="egsp-h">
<style>
.egsp{--fg:#CFDCCF;--accent:rgb(232,101,60);--muted:rgba(207,220,207,.75);--rule:rgba(207,220,207,.18);--ok:#7cc495;--warn:#e0b04a;border:1px solid var(--rule);border-radius:12px;background:rgba(255,255,255,.035);padding:20px;margin:0 0 44px;display:grid;gap:12px;max-width:1000px}
.egsp h2{margin:0;color:var(--accent);font-size:27px;line-height:1.15}
.egsp p{margin:0;color:var(--fg)}
.egsp .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.egsp .q{font-weight:600;font-size:17px;color:#F3EFE4}
.egsp .score{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.egsp .stage{position:relative;border-radius:8px;overflow:hidden;cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;line-height:0}
.egsp .stage img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.egsp .stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.egsp .mark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--accent);pointer-events:none}
.egsp .mark.hit{border-color:var(--ok)}
.egsp .fb{min-height:1.5em;font-size:15.5px;line-height:1.55}
.egsp .fb b{color:var(--ok)}
.egsp .fb.miss b{color:var(--warn)}
.egsp .btns{display:flex;gap:8px;flex-wrap:wrap}
.egsp button{font:inherit;font-size:15px;color:var(--fg);background:transparent;border:1.5px solid var(--rule);border-radius:999px;padding:7px 16px;cursor:pointer}
.egsp button:hover{border-color:var(--accent)}
.egsp button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.egsp button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.egsp .cap{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.egsp .mark{animation:egsppop .25s ease-out}@keyframes egsppop{from{transform:scale(.4)}to{transform:scale(1)}}}
@media (max-width:767px){.egsp{padding:14px}.egsp h2{font-size:23px}}
</style>
<h2 id="egsp-h">Spot the insect</h2>
<div class="bar"><p class="q" id="egsp-q">One of these leaves is an insect. Which one?</p><span class="score" id="egsp-score">Photo 1 of 3 · found 0</span></div>
<div class="stage" id="egsp-stage" role="button" tabindex="0" aria-label="Photo: tap where you think the insect is. Press Enter to reveal it.">
<img id="egsp-img" src="https://images.squarespace-cdn.com/content/67469cd20b2bb9492dfb7801/cfbf5fd5-7699-4042-b1c0-8a0e0e5bd58b/EGPL_Leaf_Mimic_Katydid_3.jpg?format=1500w" width="1500" height="1000" alt="Leaves on a sapling, one of which is a katydid">
<svg id="egsp-svg" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg>
</div>
<p class="fb" id="egsp-fb" aria-live="polite">Tap the photo where you think the insect is.</p>
<div class="bar"><span class="cap" id="egsp-cap">Leaf-mimic katydid · © Endemic Greens</span><span class="btns"><button type="button" id="egsp-show">Show me</button><button type="button" class="primary" id="egsp-next">Next photo</button></span></div>

</div>
