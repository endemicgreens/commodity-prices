name: probe-sources
on:
  push:
    branches: [setup-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
      - name: Save results to a branch
        run: |
          git config user.name "price-bot"
          git config user.email "connect@endemicgreens.com"
          git checkout --orphan probe-output
          git rm -rq --cached . || true
          git add -f out/
          git commit -qm "Probe output $(date -u +%FT%TZ)"
          git push -f origin probe-output
