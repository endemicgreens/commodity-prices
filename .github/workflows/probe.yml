name: probe-sources
on:
  push:
    branches: [setup-test]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
