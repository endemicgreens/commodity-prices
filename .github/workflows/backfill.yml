name: backfill-history
on:
  push:
    branches: [main]
    paths: ["scripts/backfill.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python scripts/backfill.py
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "connect@endemicgreens.com"
          git pull -q --rebase origin main || true
          git add data/
          git diff --cached --quiet || (git commit -qm "Load price history" && git push)
