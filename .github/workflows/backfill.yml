name: backfill-history
on:
  push:
    branches: [main]
    paths: ["scripts/backfill.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python scripts/backfill.py
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "connect@endemicgreens.com"
          mv data/history_backfill.json data/backfill_log.txt "$RUNNER_TEMP"/
          git checkout -- data
          for i in 1 2 3; do
            git pull -q --rebase origin main
            python scripts/backfill.py --merge "$RUNNER_TEMP/history_backfill.json"
            cp "$RUNNER_TEMP/backfill_log.txt" data/
            git add data/
            git diff --cached --quiet && break
            git commit -qm "Load price history"
            git push && break
            git reset -q --hard origin/main
          done
