name: update-prices
on:
  schedule:
    - cron: "30 3 * * *"    # 09:00 IST
    - cron: "30 12 * * *"   # 18:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/prices.yml", "site/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch prices
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_prices.py
      - name: Save data
        run: |
          git config user.name "price-bot"
          git config user.email "connect@endemicgreens.com"
          git add data/
          git diff --cached --quiet || (git commit -qm "Prices $(TZ=Asia/Kolkata date +'%F %H:%M') IST" && git push)
      - name: Build site folder
        run: |
          mkdir -p _site
          cp data/prices.json data/history.json _site/
          cp site/* _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Report a source that could not be read
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "At least one source could not be read. The page keeps showing the last good figures, marked as not updated."
          exit 1
