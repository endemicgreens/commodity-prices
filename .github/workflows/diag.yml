name: diag-coffee
on:
  push:
    branches: [main]
    paths: ["scripts/diag_coffee.py"]
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python scripts/diag_coffee.py
      - run: |
          git config user.name "price-bot"; git config user.email "connect@endemicgreens.com"
          git pull -q --rebase origin main; git add -f data/diag_coffee.txt; git commit -qm "Coffee report samples"; git push
